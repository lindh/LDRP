# Experiment configuration for test.py / run.py.
# CLI override: python3 test.py <map_name> <agent_num> <path_planner> <task_assigner>

# --- Environment ---
map_name: "map_5x4"   # e.g. map_5x4, map_8x5, map_aoba00, map_aoba01 (see src/main/drp_env/map/)
agent_num: 3          # team size
time_limit: 1000      # step budget per episode
safe_mode: false      # true = use the safety-layer environment (SafeIQL/SafeQMIX)

# --- Policy ---
task_assigner: "tp"   # "fifo" (first-in, first-out; legacy alias "random") | "tp" (Token Passing)
path_planner: "pbs"   # "pbs" (prioritized planning, PP) | "iql" | "qmix" (the latter two need trained models)

# --- Evaluation ---
test_num: 1           # episodes per condition (use e.g. 1000 for stable averages)

# --- Training hyperparameters (PPO task assigner; unused by the baselines above) ---
n_envs: 8
running_steps: 20000000
buffer_size: 1024
batch_size: 64
epochs: 4
learning_rate: 0.0003
gamma: 0.99
gae_lambda: 0.95
clip_epsilon: 0.2
entropy_coef: 0.0001
value_loss_coef: 0.5
